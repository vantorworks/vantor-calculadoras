<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VANTOR | Gestão</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17253a;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.shell{max-width:1200px;margin:auto;padding:22px}.panel{background:#fff;border:1px solid #e1e7ef;border-radius:15px;padding:22px;margin:15px 0}.login{max-width:440px;margin:10vh auto}.hidden{display:none!important}.brand{font-size:25px;font-weight:800}.muted{color:#68778a}.nav,.actions{display:flex;gap:9px;flex-wrap:wrap;margin:17px 0}.nav button.active,.primary{background:#172b4d;color:#fff}button{border:1px solid #ccd7e5;background:white;border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:600;color:#253b55}button:disabled{opacity:.5}input,select,textarea{font:inherit;border:1px solid #cdd8e5;border-radius:9px;padding:10px;width:100%;background:white;color:#17253a}label{font-size:13px;font-weight:650;display:flex;flex-direction:column;gap:6px}.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{background:#f0f5fa;border-radius:12px;padding:15px}.metric small{color:#65758a;display:block}.metric strong{font-size:22px}.notice{background:#edf4fb;color:#284d70;padding:12px;border-radius:10px;margin:12px 0}.error{background:#fff0ef;color:#a52c32}.ok{background:#edf8f1;color:#176a42}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:10px;border-bottom:1px solid #e7edf4;text-align:left}th{background:#f8fafc}.danger{color:#a52c32}h2{margin:0 0 15px;font-size:20px}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}.sectionhead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}.footer{font-size:12px;color:#718096}@media(max-width:800px){.grid,.formgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:540px){.grid,.formgrid{grid-template-columns:1fr}.shell{padding:12px}.panel{padding:15px}}
</style></head><body>
<div id="login" class="login panel"><div class="brand">VANTOR | Gestão</div><p class="muted">Acesso exclusivo aos administradores.</p><form id="loginForm"><label>E-mail<input id="email" type="email" autocomplete="username" required></label><br><label>Senha<input id="password" type="password" autocomplete="current-password" required></label><div class="actions"><button class="primary" id="loginBtn">Entrar</button></div></form><div id="loginMessage" class="notice hidden"></div></div>
<div id="app" class="shell hidden"><header class="top"><div><div class="brand">VANTOR | Gestão</div><div class="muted">Gestão de impressão 3D e marketplaces</div></div><div><span id="userEmail"></span> <button id="logout">Sair</button></div></header><nav class="nav" id="nav"><button data-page="painel" class="active">Painel</button><button data-page="produtos">Produtos</button><button data-page="vendas">Vendas</button><button data-page="materiais">Materiais</button><button data-page="producoes">Produção</button><button data-page="impressoras">Impressoras</button><button data-page="configuracoes">Precificação</button><button data-page="financeiro">Financeiro</button><a href="./index.html" style="align-self:center">Calculadoras ↗</a></nav><div id="message" class="notice hidden"></div><main id="content"></main><p class="footer">VANTOR Gestão • custos históricos preservados • sincronizado via Supabase</p></div>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.57.0';
const client=createClient('https://nzjcclcklbukcgkoyrhu.supabase.co','sb_publishable_Mtu7ZSz5qkZlzbI2HaRXtg_yEQdQvlt',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const $=id=>document.getElementById(id), esc=x=>String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;'),brl=x=>Number(x||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),today=()=>new Date().toLocaleDateString('en-CA');
let page='painel',records=[],editing=null,machines=[],settings=null;
const configs={
produtos:{title:'Produtos',fields:[['nome','Nome','text',1],['sku','SKU','text'],['descricao','Descrição','text'],['custo_estimado','Custo estimado (R$)','number'],['preco_base','Preço base (R$)','number']],columns:['nome','sku','custo_estimado','preco_base']},
vendas:{title:'Vendas',fields:[['data_venda','Data da venda','date',1],['marketplace','Canal','select',1,['Shopee','TikTok Shop','Direta','Outro']],['pedido_externo','Nº do pedido','text'],['status','Status','select',1,['novo','em_producao','enviado','concluido','cancelado']],['valor_bruto','Valor bruto (R$)','number',1],['descontos_vendedor','Descontos do vendedor (R$)','number'],['taxas_marketplace','Taxas marketplace (R$)','number'],['outros_custos_venda','Outros custos (R$)','number'],['data_prevista_repasse','Previsão de repasse','date'],['observacoes','Observações','text']],columns:['data_venda','marketplace','pedido_externo','status','valor_bruto','taxas_marketplace']},
materiais:{title:'Materiais e estoque',fields:[['nome','Nome','text',1],['categoria','Categoria','select',1,['filamento','tag_nfc','embalagem','outro']],['unidade','Unidade','select',1,['g','un','kg','m','ml']],['quantidade_atual','Quantidade atual','number'],['custo_medio_unitario','Custo médio por unidade (R$)','number'],['estoque_minimo','Estoque mínimo','number'],['observacoes','Observações','text']],columns:['nome','categoria','unidade','quantidade_atual','custo_medio_unitario']},
producoes:{title:'Produção 3D',fields:[['data_producao','Data','date',1],['descricao','Descrição da impressão','text',1],['quantidade','Quantidade','number',1],['maquina_vantor_id','Impressora','machine',1],['tempo_minutos','Tempo (minutos)','number',1],['peso_total_g','Peso total (g)','number',1],['outros_custos','Outros custos (R$)','number'],['status','Status','select',1,['concluida','em_andamento','falha','cancelada']],['observacoes','Observações','text']],columns:['data_producao','descricao','maquina_vantor_id','tempo_minutos','peso_total_g','custo_total_estimado','status']},
financeiro:{title:'Financeiro',fields:[['descricao','Descrição','text',1],['categoria','Categoria','text',1],['tipo','Tipo','select',1,['entrada','saida']],['valor','Valor (R$)','number',1],['vencimento','Vencimento','date'],['data_efetivacao','Data efetivada','date'],['status','Status','select',1,['pendente','efetivado','cancelado']],['observacoes','Observações','text']],columns:['descricao','categoria','tipo','valor','status','data_efetivacao']}
};
function notify(t,error=false){$('message').textContent=t;$('message').className='notice '+(error?'error':'ok');}function err(t){$('content').innerHTML='<div class="notice error">'+esc(t)+'</div>';}async function auth(){const {data:{user}}=await client.auth.getUser();if(!user)return false;const {data,error}=await client.rpc('is_vantor_admin');if(error||data!==true){await client.auth.signOut();return false;}$('userEmail').textContent=user.email;return true;}
async function session(){const yes=await auth();$('login').classList.toggle('hidden',yes);$('app').classList.toggle('hidden',!yes);if(yes)openPage('painel');}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginBtn').disabled=true;const {error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('loginBtn').disabled=false;if(error){$('loginMessage').textContent='Não foi possível entrar. Confira e-mail e senha.';$('loginMessage').className='notice error';return;}session();};$('logout').onclick=async()=>{await client.auth.signOut();$('app').classList.add('hidden');$('login').classList.remove('hidden');};$('nav').onclick=e=>{const b=e.target.closest('button[data-page]');if(b)openPage(b.dataset.page);};
async function openPage(p){page=p;editing=null;$('message').classList.add('hidden');document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('content').innerHTML='<div class="panel">Carregando…</div>';if(p==='painel')return dashboard();if(p==='impressoras')return printers();if(p==='configuracoes')return pricing();return loadTable();}
async function dashboard(){const names=['vendas','financeiro','produtos','materiais','producoes'];const all=await Promise.all(names.map(n=>client.from(n).select('*')));if(all.some(x=>x.error))return err(all.find(x=>x.error).error.message);const [v,f,prod,mat,pr]=all.map(x=>x.data||[]),gross=v.filter(x=>x.status!=='cancelado').reduce((a,x)=>a+Number(x.valor_bruto||0),0),fees=v.filter(x=>x.status!=='cancelado').reduce((a,x)=>a+Number(x.taxas_marketplace||0)+Number(x.descontos_vendedor||0)+Number(x.outros_custos_venda||0),0),paid=f.filter(x=>x.status==='efetivado'),income=paid.filter(x=>x.tipo==='entrada').reduce((a,x)=>a+Number(x.valor||0),0),expense=paid.filter(x=>x.tipo==='saida').reduce((a,x)=>a+Number(x.valor||0),0),cards=[['Vendas brutas',brl(gross)],['Taxas e descontos',brl(fees)],['Entradas efetivadas',brl(income)],['Saldo registrado',brl(income-expense)],['Produtos',prod.length],['Materiais',mat.length],['Produções',pr.length],['Vendas',v.length]];$('content').innerHTML='<section class="panel"><h2>Painel geral</h2><div class="grid">'+cards.map(c=>'<div class="metric"><small>'+esc(c[0])+'</small><strong>'+esc(c[1])+'</strong></div>').join('')+'</div><div class="notice">Vendas e lançamentos de caixa são independentes. O histórico do Excel ainda não foi importado.</div></section>';}
function fieldHTML(f,v){const [key,label,type,required,opts]=f;v=v??(type==='date'&&key.startsWith('data_')?today():'');let control;if(type==='select'||type==='machine'){const options=type==='machine'?machines.map(m=>[m.id,m.nome]):opts.map(o=>[o,o]);control='<select name="'+key+'" '+(required?'required':'')+'>'+options.map(([id,name])=>'<option value="'+esc(id)+'" '+(id===v?'selected':'')+'>'+esc(name)+'</option>').join('')+'</select>';}else control='<input name="'+key+'" type="'+type+'" '+(required?'required':'')+' '+(type==='number'?'min="0" step="any"':'')+' value="'+esc(v)+'">';return '<label>'+esc(label)+control+'</label>';}
async function loadTable(){if(page==='producoes'){const [m,s]=await Promise.all([client.from('maquinas_vantor').select('*'),client.from('config_precificacao_vantor').select('*').eq('id',1).single()]);if(m.error||s.error)return err('Execute primeiro o SQL de atualização no Supabase: '+(m.error?.message||s.error?.message));machines=m.data;settings=s.data;}const {data,error}=await client.from(page).select('*').order('created_at',{ascending:false}).limit(500);if(error)return err(error.message);records=data||[];renderTable();}
function renderTable(){const cfg=configs[page];$('content').innerHTML='<section class="panel"><div class="sectionhead"><h2>'+cfg.title+'</h2><button class="primary" id="add">+ Novo registro</button></div><div class="notice">'+records.length+' registros. '+(page==='producoes'?'Os custos são gravados com os parâmetros do momento da impressão.':'')+'</div><div id="editor" class="hidden"></div><div class="tablewrap"><table><thead><tr>'+cfg.columns.map(c=>'<th>'+esc(c.replaceAll('_',' '))+'</th>').join('')+'<th>Ações</th></tr></thead><tbody>'+records.map(r=>'<tr>'+cfg.columns.map(c=>'<td>'+esc(page==='producoes'&&c==='maquina_vantor_id'?(machines.find(m=>m.id===r[c])?.nome||r[c]):['valor','valor_bruto','taxas_marketplace','custo_estimado','preco_base','custo_medio_unitario','custo_total_estimado'].includes(c)?brl(r[c]):r[c])+'</td>').join('')+'<td><button data-edit="'+esc(r.id)+'">Editar</button><button class="danger" data-del="'+esc(r.id)+'">Excluir</button></td></tr>').join('')+'</tbody></table></div></section>';$('add').onclick=()=>showForm();$('content').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>showForm(records.find(r=>r.id===b.dataset.edit)));$('content').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>removeRecord(b.dataset.del));}
function calculate(d){const m=machines.find(x=>x.id===d.maquina_vantor_id);if(!m)throw Error('Selecione uma impressora.');const h=Number(d.tempo_minutos||0)/60,fil=Number(d.peso_total_g||0)*Number(settings.custo_filamento_kg)/1000,energy=h*Number(m.potencia_w)/1000*Number(settings.tarifa_kwh),dep=h*Number(m.valor_aquisicao)/Number(m.vida_util_referencia_h)*Number(settings.reserva_depreciacao),base=fil+energy+dep+Number(d.outros_custos||0),error=base*Number(settings.margem_erro);return {custo_filamento:fil,custo_energia:energy,custo_depreciacao:dep,margem_erro_valor:error,custo_total_estimado:base+error,custo_kwh_snapshot:settings.tarifa_kwh,custo_kg_snapshot:settings.custo_filamento_kg,taxa_depreciacao_snapshot:settings.reserva_depreciacao,taxa_erro_snapshot:settings.margem_erro};}
function showForm(rec){editing=rec?.id||null;const editor=$('editor');editor.classList.remove('hidden');editor.innerHTML='<h3>'+(rec?'Editar registro':'Novo registro')+'</h3><form id="dataForm"><div class="formgrid">'+configs[page].fields.map(f=>fieldHTML(f,rec?.[f[0]])).join('')+'</div>'+(page==='producoes'?'<div id="estimate" class="notice"></div><p class="muted">Somente novas produções concluídas contam horas. Registros anteriores à implantação permanecem fora da soma.</p>':'')+'<div class="actions"><button class="primary" type="submit">Salvar</button><button type="button" id="cancelEdit">Cancelar</button></div></form>';$('cancelEdit').onclick=()=>editor.classList.add('hidden');$('dataForm').onsubmit=saveRecord;if(page==='producoes'){const preview=()=>{try{const f=$('dataForm'),d={};for(const x of configs.producoes.fields)d[x[0]]=f.elements[x[0]].value;const c=calculate(d);$('estimate').textContent='Estimativa: filamento '+brl(c.custo_filamento)+' • energia '+brl(c.custo_energia)+' • reserva '+brl(c.custo_depreciacao)+' • margem de erro '+brl(c.margem_erro_valor)+' • TOTAL '+brl(c.custo_total_estimado);}catch(ex){$('estimate').textContent=ex.message;}};$('dataForm').addEventListener('input',preview);preview();}editor.scrollIntoView({block:'start',behavior:'smooth'});}
async function saveRecord(e){e.preventDefault();const btn=e.target.querySelector('[type=submit]');btn.disabled=true;try{const d={};for(const f of configs[page].fields){let v=e.target.elements[f[0]].value;if(f[2]==='number')v=v===''?null:Number(v);else if(v==='')v=null;d[f[0]]=v;}if(page==='producoes'){Object.assign(d,calculate(d));if(!editing)d.contabilizar_horas=true;}const res=editing?await client.from(page).update(d).eq('id',editing):await client.from(page).insert(d);if(res.error)throw res.error;await loadTable();notify('Registro salvo com sucesso.');}catch(ex){notify('Não foi possível salvar: '+ex.message,true);}finally{btn.disabled=false;}}
async function removeRecord(id){if(!confirm('Excluir este registro? Esta ação não poderá ser desfeita pela interface.'))return;const {error}=await client.from(page).delete().eq('id',id);if(error)return notify(error.message,true);await loadTable();notify('Registro excluído.');}
async function printers(){const [m,p]=await Promise.all([client.from('maquinas_vantor').select('*').order('nome'),client.from('producoes').select('maquina_vantor_id,tempo_minutos,status,contabilizar_horas')]);if(m.error||p.error)return err('Execute primeiro o SQL de atualização: '+(m.error?.message||p.error?.message));machines=m.data;const hours=id=>p.data.filter(x=>x.maquina_vantor_id===id&&x.status==='concluida'&&x.contabilizar_horas).reduce((a,x)=>a+Number(x.tempo_minutos||0)/60,0);$('content').innerHTML='<section class="panel"><h2>Impressoras</h2><div class="notice">As horas iniciais já incluem as impressões anteriores à implantação. Potências são estimativas ajustáveis.</div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(250px,1fr))">'+machines.map(m=>'<div class="metric"><h3>'+esc(m.nome)+'</h3><p>Compra: <strong>'+brl(m.valor_aquisicao)+'</strong></p><p>Horas iniciais: '+Number(m.horas_iniciais).toLocaleString('pt-BR')+' h</p><p>Novas horas concluídas: '+hours(m.id).toFixed(2)+' h</p><p><strong>Total: '+(Number(m.horas_iniciais)+hours(m.id)).toFixed(2)+' h</strong></p><button data-machine="'+esc(m.id)+'">Editar parâmetros</button></div>').join('')+'</div><div id="machineEditor"></div></section>';$('content').querySelectorAll('[data-machine]').forEach(b=>b.onclick=()=>editMachine(machines.find(x=>x.id===b.dataset.machine)));}
function editMachine(m){$('machineEditor').innerHTML='<h3>Editar '+esc(m.nome)+'</h3><form id="machineForm"><div class="formgrid">'+[['valor_aquisicao','Valor de aquisição (R$)'],['horas_iniciais','Horas iniciais (h)'],['potencia_w','Potência média estimada (W)'],['vida_util_referencia_h','Vida útil de referência (h)']].map(([k,l])=>'<label>'+l+'<input name="'+k+'" type="number" step="any" min="0.01" value="'+esc(m[k])+'" required></label>').join('')+'</div><div class="actions"><button class="primary">Salvar impressora</button></div></form>';$('machineForm').onsubmit=async e=>{e.preventDefault();const d={};for(const k of ['valor_aquisicao','horas_iniciais','potencia_w','vida_util_referencia_h'])d[k]=Number(e.target.elements[k].value);const {error}=await client.from('maquinas_vantor').update(d).eq('id',m.id);if(error)return notify(error.message,true);await printers();notify('Impressora atualizada.');};}
async function pricing(){const {data,error}=await client.from('config_precificacao_vantor').select('*').eq('id',1).single();if(error)return err('Execute primeiro o SQL de atualização: '+error.message);settings=data;const fields=[['tarifa_kwh','Tarifa de energia (R$/kWh)'],['custo_filamento_kg','Custo de referência do filamento (R$/kg)'],['reserva_depreciacao','Reserva de depreciação (fração: 0,10 = 10%)'],['margem_erro','Margem para erros (fração: 0,30 = 30%)']];$('content').innerHTML='<section class="panel"><h2>Parâmetros de precificação</h2><p class="muted">Alterações valem para novas precificações; os valores gravados nas produções existentes não mudam automaticamente.</p><form id="priceForm"><div class="formgrid">'+fields.map(([k,l])=>'<label>'+l+'<input type="number" step="any" min="0" name="'+k+'" value="'+esc(data[k])+'" required></label>').join('')+'</div><div class="actions"><button class="primary">Salvar configurações</button></div></form></section>';$('priceForm').onsubmit=async e=>{e.preventDefault();const d={};for(const [k] of fields)d[k]=Number(e.target.elements[k].value);if(d.reserva_depreciacao>1||d.margem_erro>1)return notify('Digite as porcentagens como frações (ex.: 0,10).',true);const {error}=await client.from('config_precificacao_vantor').update(d).eq('id',1);if(error)return notify(error.message,true);notify('Parâmetros atualizados.');};}
session();
</script></body></html>
