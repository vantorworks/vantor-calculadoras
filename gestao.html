async function dashboard(){const names=['vendas','financeiro','produtos','materiais','producoes'];const all=await Promise.all(names.map(n=>client.from(n).select('*')));if(all.some(x=>x.error))return err(all.find(x=>x.error).error.message);const [v,f,prod,mat,pr]=all.map(x=>x.data||[]),gross=v.filter(x=>x.status!=='cancelado').reduce((a,x)=>a+Number(x.valor_bruto||0),0),fees=v.filter(x=>x.status!=='cancelado').reduce((a,x)=>a+Number(x.taxas_marketplace||0)+Number(x.descontos_vendedor||0)+Number(x.outros_custos_venda||0),0),paid=f.filter(x=>x.status==='efetivado'),income=paid.filter(x=>x.tipo==='entrada').reduce((a,x)=>a+Number(x.valor||0),0),expense=paid.filter(x=>x.tipo==='saida').reduce((a,x)=>a+Number(x.valor||0),0),cards=[['Vendas brutas',brl(gross)],['Taxas e descontos',brl(fees)],['Entradas efetivadas',brl(income)],['Saldo registrado',brl(income-expense)],['Produtos',prod.length],['Materiais',mat.length],['Produções',pr.length],['Vendas',v.length]];$('content').innerHTML='<section class="panel"><h2>Painel geral</h2><div class="grid">'+cards.map(c=>'<div class="metric"><small>'+esc(c[0])+'</small><strong>'+esc(c[1])+'</strong></div>').join('')+'</div><div class="notice">Vendas e lançamentos de caixa são independentes. O histórico do Excel ainda não foi importado.</div></section>';}
function fieldHTML(f,v){const [key,label,type,required,opts]=f;v=v??(type==='date'&&key.startsWith('data_')?today():'');let control;if(type==='select'||type==='machine'){const options=type==='machine'?machines.map(m=>[m.id,m.nome]):opts.map(o=>[o,o]);control='<select name="'+key+'" '+(required?'required':'')+'>'+options.map(([id,name])=>'<option value="'+esc(id)+'" '+(id===v?'selected':'')+'>'+esc(name)+'</option>').join('')+'</select>';}else control='<input name="'+key+'" type="'+type+'" '+(required?'required':'')+' '+(type==='number'?'min="0" step="any"':'')+' value="'+esc(v)+'">';return '<label>'+esc(label)+control+'</label>';}
async function loadTable(){if(page==='producoes'){const [m,s]=await Promise.all([client.from('maquinas_vantor').select('*'),client.from('config_precificacao_vantor').select('*').eq('id',1).single()]);if(m.error||s.error)return err('Execute primeiro o SQL de atualização no Supabase: '+(m.error?.message||s.error?.message));machines=m.data;settings=s.data;}const {data,error}=await client.from(page).select('*').order('created_at',{ascending:false}).limit(500);if(error)return err(error.message);records=data||[];renderTable();}

function calculate(d){const m=machines.find(x=>x.id===d.maquina_vantor_id);if(!m)throw Error('Selecione uma impressora.');const h=Number(d.tempo_minutos||0)/60,fil=Number(d.peso_total_g||0)*Number(settings.custo_filamento_kg)/1000,energy=h*Number(m.potencia_w)/1000*Number(settings.tarifa_kwh),dep=h*Number(m.valor_aquisicao)/Number(m.vida_util_referencia_h)*Number(settings.reserva_depreciacao),base=fil+energy+dep+Number(d.outros_custos||0),error=base*Number(settings.margem_erro);return {custo_filamento:fil,custo_energia:energy,custo_depreciacao:dep,margem_erro_valor:error,custo_total_estimado:base+error,custo_kwh_snapshot:settings.tarifa_kwh,custo_kg_snapshot:settings.custo_filamento_kg,taxa_depreciacao_snapshot:settings.reserva_depreciacao,taxa_erro_snapshot:settings.margem_erro};}
function showForm(rec){editing=rec?.id||null;const editor=$('editor');editor.classList.remove('hidden');editor.innerHTML='<h3>'+(rec?'Editar registro':'Novo registro')+'</h3><form id="dataForm"><div class="formgrid">'+configs[page].fields.map(f=>fieldHTML(f,rec?.[f[0]])).join('')+'</div>'+(page==='producoes'?'<div id="estimate" class="notice"></div><p class="muted">Somente novas produções concluídas contam horas. Registros anteriores à implantação permanecem fora da soma.</p>':'')+'<div class="actions"><button class="primary" type="submit">Salvar</button><button type="button" id="cancelEdit">Cancelar</button></div></form>';$('cancelEdit').onclick=()=>editor.classList.add('hidden');$('dataForm').onsubmit=saveRecord;if(page==='producoes'){const preview=()=>{try{const f=$('dataForm'),d={};for(const x of configs.producoes.fields)d[x[0]]=f.elements[x[0]].value;const c=calculate(d);$('estimate').textContent='Estimativa: filamento '+brl(c.custo_filamento)+' • energia '+brl(c.custo_energia)+' • reserva '+brl(c.custo_depreciacao)+' • margem de erro '+brl(c.margem_erro_valor)+' • TOTAL '+brl(c.custo_total_estimado);}catch(ex){$('estimate').textContent=ex.message;}};$('dataForm').addEventListener('input',preview);preview();}editor.scrollIntoView({block:'start',behavior:'smooth'});}
async function saveRecord(e){e.preventDefault();const btn=e.target.querySelector('[type=submit]');btn.disabled=true;try{const d={};for(const f of configs[page].fields){let v=e.target.elements[f[0]].value;if(f[2]==='number')v=v===''?null:Number(v);else if(v==='')v=null;d[f[0]]=v;}if(page==='producoes'){Object.assign(d,calculate(d));if(!editing)d.contabilizar_horas=true;}const res=editing?await client.from(page).update(d).eq('id',editing):await client.from(page).insert(d);if(res.error)throw res.error;await loadTable();notify('Registro salvo com sucesso.');}catch(ex){notify('Não foi possível salvar: '+ex.message,true);}finally{btn.disabled=false;}}
async function removeRecord(id){if(!confirm('Excluir este registro? Esta ação não poderá ser desfeita pela interface.'))return;const {error}=await client.from(page).delete().eq('id',id);if(error)return notify(error.message,true);await loadTable();notify('Registro excluído.');}
async function printers(){const [m,p]=await Promise.all([client.from('maquinas_vantor').select('*').order('nome'),client.from('producoes').select('maquina_vantor_id,tempo_minutos,status,contabilizar_horas')]);if(m.error||p.error)return err('Execute primeiro o SQL de atualização: '+(m.error?.message||p.error?.message));machines=m.data;const hours=id=>p.data.filter(x=>x.maquina_vantor_id===id&&x.status==='concluida'&&x.contabilizar_horas).reduce((a,x)=>a+Number(x.tempo_minutos||0)/60,0);$('content').innerHTML='<section class="panel"><h2>Impressoras</h2><div class="notice">As horas iniciais já incluem as impressões anteriores à implantação. Potências são estimativas ajustáveis.</div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(250px,1fr))">'+machines.map(m=>'<div class="metric"><h3>'+esc(m.nome)+'</h3><p>Compra: <strong>'+brl(m.valor_aquisicao)+'</strong></p><p>Horas iniciais: '+Number(m.horas_iniciais).toLocaleString('pt-BR')+' h</p><p>Novas horas concluídas: '+hours(m.id).toFixed(2)+' h</p><p><strong>Total: '+(Number(m.horas_iniciais)+hours(m.id)).toFixed(2)+' h</strong></p><button data-machine="'+esc(m.id)+'">Editar parâmetros</button></div>').join('')+'</div><div id="machineEditor"></div></section>';$('content').querySelectorAll('[data-machine]').forEach(b=>b.onclick=()=>editMachine(machines.find(x=>x.id===b.dataset.machine)));}
function editMachine(m){$('machineEditor').innerHTML='<h3>Editar '+esc(m.nome)+'</h3><form id="machineForm"><div class="formgrid">'+[['valor_aquisicao','Valor de aquisição (R$)'],['horas_iniciais','Horas iniciais (h)'],['potencia_w','Potência média estimada (W)'],['vida_util_referencia_h','Vida útil de referência (h)']].map(([k,l])=>'<label>'+l+'<input name="'+k+'" type="number" step="any" min="0.01" value="'+esc(m[k])+'" required></label>').join('')+'</div><div class="actions"><button class="primary">Salvar impressora</button></div></form>';$('machineForm').onsubmit=async e=>{e.preventDefault();const d={};for(const k of ['valor_aquisicao','horas_iniciais','potencia_w','vida_util_referencia_h'])d[k]=Number(e.target.elements[k].value);const {error}=await client.from('maquinas_vantor').update(d).eq('id',m.id);if(error)return notify(error.message,true);await printers();notify('Impressora atualizada.');};}
async function pricing(){const {data,error}=await client.from('config_precificacao_vantor').select('*').eq('id',1).single();if(error)return err('Execute primeiro o SQL de atualização: '+error.message);settings=data;const fields=[['tarifa_kwh','Tarifa de energia (R$/kWh)'],['custo_filamento_kg','Custo de referência do filamento (R$/kg)'],['reserva_depreciacao','Reserva de depreciação (fração: 0,10 = 10%)'],['margem_erro','Margem para erros (fração: 0,30 = 30%)']];$('content').innerHTML='<section class="panel"><h2>Parâmetros de precificação</h2><p class="muted">Alterações valem para novas precificações; os valores gravados nas produções existentes não mudam automaticamente.</p><form id="priceForm"><div class="formgrid">'+fields.map(([k,l])=>'<label>'+l+'<input type="number" step="any" min="0" name="'+k+'" value="'+esc(data[k])+'" required></label>').join('')+'</div><div class="actions"><button class="primary">Salvar configurações</button></div></form></section>';$('priceForm').onsubmit=async e=>{e.preventDefault();const d={};for(const [k] of fields)d[k]=Number(e.target.elements[k].value);if(d.reserva_depreciacao>1||d.margem_erro>1)return notify('Digite as porcentagens como frações (ex.: 0,10).',true);const {error}=await client.from('config_precificacao_vantor').update(d).eq('id',1);if(error)return notify(error.message,true);notify('Parâmetros atualizados.');};}

const n=v=>Math.max(0,Number(v)||0);
const round2=v=>Math.round((v+Number.EPSILON)*100)/100;

 const [a,b,c]=await Promise.all([client.from('estoque_pronto_vantor').select('*').order('created_at',{ascending:false}),client.from('produtos').select('id,nome,custo_estimado').order('nome'),client.from('producoes').select('id,descricao,quantidade,custo_total_estimado,status').eq('status','concluida').order('created_at',{ascending:false}).limit(200)]);

 $('content').innerHTML='<section class="panel"><h2>Estoque de produtos prontos</h2><div class="notice">'+sum+' unidades disponíveis. Cada lote mantém o custo unitário registrado. Venda sob encomenda não cria estoque negativo.</div><h3>Adicionar lote fabricado</h3><form id="stockForm"><div class="formgrid"><label>Produto<select name="produto_id" required>'+opt('','Selecione')+catalog.map(x=>opt(x.id,x.nome)).join('')+'</select></label><label>Produção concluída (opcional)<select name="producao_id">'+opt('','Sem vínculo')+c.data.map(x=>opt(x.id,x.descricao+' ('+x.quantidade+' un.)')).join('')+'</select></label><label>Quantidade fabricada<input name="quantidade" type="number" min="1" step="1" required></label><label>Custo unitário real (R$)<input name="custo_unitario" type="number" min="0" step="0.001" required></label></div><div class="actions"><button class="primary" type="submit">Adicionar ao estoque</button></div></form><p class="small muted">Para um lote com várias peças, divida o custo total da produção pela quantidade fabricada. Uma produção pode ser vinculada uma única vez ao estoque para evitar duplicidade.</p></section><section class="panel"><h2>Lotes disponíveis</h2><div class="tablewrap"><table><thead><tr><th>Produto</th><th>Disponível</th><th>Custo/un.</th><th>Valor em estoque</th><th>Origem</th></tr></thead><tbody>'+stockRows.map(x=>'<tr><td>'+esc(catalog.find(p=>p.id===x.produto_id)?.nome||x.produto_id)+'</td><td>'+n(x.quantidade_disponivel)+'</td><td>'+brl(x.custo_unitario)+'</td><td>'+brl(n(x.quantidade_disponivel)*n(x.custo_unitario))+'</td><td>'+esc(x.producao_id?'Produção vinculada':'Lote manual')+'</td></tr>').join('')+'</tbody></table></div></section>';
 $('stockForm').elements.producao_id.onchange=e=>{const prod=c.data.find(x=>x.id===e.target.value);if(prod){$('stockForm').elements.quantidade.value=prod.quantidade||1;$('stockForm').elements.custo_unitario.value=round2(n(prod.custo_total_estimado)/Math.max(1,n(prod.quantidade)));}};
 $('stockForm').onsubmit=async e=>{e.preventDefault();const f=e.target;const d={produto_id:f.elements.produto_id.value,producao_id:f.elements.producao_id.value||null,quantidade_inicial:Number(f.elements.quantidade.value),quantidade_disponivel:Number(f.elements.quantidade.value),custo_unitario:Number(f.elements.custo_unitario.value)};const {error}=await client.from('estoque_pronto_vantor').insert(d);if(error)return notify('Não foi possível adicionar: '+error.message,true);await stockPage();notify('Lote registrado.');};
}
// Regras correspondentes à calculadora publicada; os parâmetros podem ser ajustados no pedido.
function calcSale(v){const price=n(v.preco),q=Math.max(1,Math.floor(n(v.quantidade))),gross=round2(price*q),channel=v.canal;let commission=0,fixed=0,shipping=0,fast=0,affiliate=0,ads=0,freight=0;
 if(channel==='Shopee') {commission=round2(gross*n(v.comissao)/100);const fixedPer=price<9?price/2:price<80?4.5:price<100?16:price<200?20:26;fixed=round2(q*fixedPer);fast=n(v.resgate);freight=n(v.frete);affiliate=round2(gross*n(v.afiliado)/100);}
 if(channel==='TikTok Shop'){commission=round2(gross*n(v.comissao)/100);fixed=round2(q*(price<50?4:6));shipping=v.envio?round2(q*Math.min(price*.06,50)):0;ads=n(v.anuncios);affiliate=round2(gross*n(v.afiliado)/100);}
 const discount=n(v.desconto),other=n(v.outros),taxes=round2(gross*n(v.imposto)/100),fees=round2(commission+fixed+shipping+fast+freight+affiliate+ads+discount+other),payout=round2(gross-fees),production=round2(q*n(v.custo_unitario)),profit=round2(payout-production-taxes);return {gross,fees,payout,production,taxes,profit,detail:{commission,fixed,shipping,fast,freight,affiliate,ads,discount,other}};
}
async function salesPage(){const [p,l,v]=await Promise.all([client.from('produtos').select('id,nome,custo_estimado').order('nome'),client.from('estoque_pronto_vantor').select('*').gt('quantidade_disponivel',0).order('created_at'),client.from('vendas_integradas_vantor').select('*').order('created_at',{ascending:false}).limit(200)]);if(p.error||l.error||v.error)return err('Atualize o SQL: '+(p.error?.message||l.error?.message||v.error?.message));catalog=p.data||[];stockRows=l.data||[];saleRows=v.data||[];
 $('content').innerHTML='<section class="panel"><h2>Registrar venda</h2><form id="saleForm"><div class="formgrid"><label>Produto<select name="produto" required>'+opt('','Selecione')+catalog.map(x=>opt(x.id,x.nome)).join('')+'</select></label><label>Tipo de venda<select name="tipo"><option value="estoque">Pronta entrega (estoque)</option><option value="encomenda">Sob encomenda (sem estoque)</option></select></label><label>Canal<select name="canal"><option>Shopee</option><option>TikTok Shop</option><option>Pix</option></select></label><label>Lote de estoque<select name="lote"><option value="">Selecione produto e lote</option></select></label><label>Quantidade<input name="quantidade" type="number" min="1" step="1" value="1" required></label><label>Preço por unidade/kit (R$)<input name="preco" type="number" min="0" step="0.01" required></label><label>Custo de produção por unidade (R$)<input name="custo_unitario" type="number" min="0" step="0.001" value="0" required></label><label>Comissão marketplace (%)<input name="comissao" type="number" min="0" step="0.01" value="14"></label><label>Resgate rápido Shopee (R$)<input name="resgate" type="number" min="0" step="0.01" value="0.49"></label><label>Frete pago pela loja (R$)<input name="frete" type="number" min="0" step="0.01" value="0"></label><label>Afiliado (%)<input name="afiliado" type="number" min="0" step="0.01" value="0"></label><label>Publicidade TikTok (R$)<input name="anuncios" type="number" min="0" step="0.01" value="0"></label><label>Descontos do vendedor (R$)<input name="desconto" type="number" min="0" step="0.01" value="0"></label><label>Outros custos (R$)<input name="outros" type="number" min="0" step="0.01" value="0"></label><label>Impostos sobre faturamento (%)<input name="imposto" type="number" min="0" step="0.01" value="0"></label><label>Pedido externo (opcional)<input name="pedido" type="text"></label></div><label style="margin-top:12px"><span><input name="envio" type="checkbox" checked style="width:auto"> TikTok: programa de taxas de envio (6%, limitado a R$ 50/kit)</span></label><div id="salePreview" class="notice"></div><div class="actions"><button class="primary" type="submit">Registrar venda</button></div></form><p class="small muted">Para encomendas, o custo é estimado até a fabricação. A venda não cria entrada no caixa automaticamente. Os cálculos de marketplace usam os parâmetros da calculadora e podem divergir do extrato real.</p></section><section class="panel"><h2>Vendas registradas</h2><div class="tablewrap"><table><thead><tr><th>Produto</th><th>Canal</th><th>Tipo</th><th>Qtde.</th><th>Bruta</th><th>Taxas</th><th>Repasse</th><th>Produção</th><th>Lucro</th></tr></thead><tbody>'+saleRows.map(x=>'<tr><td>'+esc(catalog.find(p=>p.id===x.produto_id)?.nome||x.produto_id)+'</td><td>'+esc(x.canal)+'</td><td>'+esc(x.tipo_venda)+'</td><td>'+x.quantidade+'</td><td>'+brl(x.receita_bruta)+'</td><td>'+brl(x.taxas_total)+'</td><td>'+brl(x.repasse_liquido)+'</td><td>'+brl(x.custo_producao)+'</td><td>'+brl(x.lucro_estimado)+(x.tipo_venda==='encomenda'?' (estimado)':'')+'</td></tr>').join('')+'</tbody></table></div></section>';
 const f=$('saleForm');const fields=['quantidade','preco','custo_unitario','comissao','resgate','frete','afiliado','anuncios','desconto','outros','imposto'];
 const current=()=>{const d={produto:f.elements.produto.value,tipo:f.elements.tipo.value,canal:f.elements.canal.value,lote:f.elements.lote.value,pedido:f.elements.pedido.value,envio:f.elements.envio.checked};for(const k of fields)d[k]=f.elements[k].value;return d;};
 const sync=()=>{const d=current();const isStock=d.tipo==='estoque';f.elements.lote.disabled=!isStock;const available=stockRows.filter(x=>x.produto_id===d.produto);const old=d.lote;f.elements.lote.innerHTML=opt('','Selecione um lote')+available.map(x=>opt(x.id,n(x.quantidade_disponivel)+' disponíveis · '+brl(x.custo_unitario)+'/un.')).join('');if(available.some(x=>x.id===old))f.elements.lote.value=old;if(isStock&&f.elements.lote.value){f.elements.custo_unitario.value=stockRows.find(x=>x.id===f.elements.lote.value).custo_unitario;}else if(!isStock){f.elements.custo_unitario.value=catalog.find(x=>x.id===d.produto)?.custo_estimado||0;}preview();};
 const preview=()=>{const d=current(),c=calcSale(d);$('salePreview').innerHTML='<strong>Prévia</strong><div class="grid"><div class="metric"><span>Receita bruta</span><strong>'+brl(c.gross)+'</strong></div><div class="metric"><span>Taxas e descontos</span><strong>'+brl(c.fees)+'</strong></div><div class="metric"><span>Repasse líquido</span><strong>'+brl(c.payout)+'</strong></div><div class="metric"><span>Custo produção</span><strong>'+brl(c.production)+'</strong></div><div class="metric"><span>Impostos</span><strong>'+brl(c.taxes)+'</strong></div><div class="metric"><span>Lucro '+(d.tipo==='encomenda'?'estimado':'líquido')+'</span><strong>'+brl(c.profit)+'</strong></div></div>';};
 f.elements.produto.onchange=sync;f.elements.tipo.onchange=sync;f.elements.lote.onchange=()=>{const x=stockRows.find(x=>x.id===f.elements.lote.value);if(x)f.elements.custo_unitario.value=x.custo_unitario;preview();};f.elements.canal.onchange=()=>{const d=current();f.elements.comissao.value=d.canal==='Shopee'?(n(d.preco)<80?20:14):d.canal==='TikTok Shop'?(n(d.preco)<50?10:6):0;f.elements.resgate.value=d.canal==='Shopee'?0.49:0;preview();};f.elements.preco.onchange=()=>f.elements.canal.onchange();f.addEventListener('input',preview);sync();
 f.onsubmit=async e=>{e.preventDefault();const d=current();if(d.tipo==='estoque'&&!d.lote)return notify('Selecione um lote disponível.',true);if(d.tipo==='estoque'&&n(d.quantidade)>n(stockRows.find(x=>x.id===d.lote)?.quantidade_disponivel))return notify('Quantidade maior que o estoque do lote.',true);const c=calcSale(d);const payload={p_produto_id:d.produto,p_lote_id:d.tipo==='estoque'?d.lote:null,p_tipo:d.tipo,p_canal:d.canal,p_quantidade:Number(d.quantidade),p_pedido:d.pedido||null,p_receita_bruta:c.gross,p_taxas_total:c.fees,p_repasse_liquido:c.payout,p_custo_producao:c.production,p_impostos:c.taxes,p_lucro_estimado:c.profit,p_detalhes:{...c.detail,params:d}};const btn=f.querySelector('button[type=submit]');btn.disabled=true;const {error}=await client.rpc('registrar_venda_vantor',payload);btn.disabled=false;if(error)return notify('Venda não registrada: '+error.message,true);await salesPage();notify('Venda registrada. Estoque atualizado quando aplicável.');};
}
