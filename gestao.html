function fieldHTML(f,v){const [key,label,type,required,opts]=f;v=v??(type==='date'&&key.startsWith('data_')?today():'');let control;if(type==='select'||type==='machine'){const options=type==='machine'?machines.map(m=>[m.id,m.nome]):opts.map(o=>[o,o]);if(!required)options.unshift(['','Não classificado']);control='<select name="'+key+'" '+(required?'required':'')+'>'+options.map(([id,name])=>'<option value="'+esc(id)+'" '+(id===v?'selected':'')+'>'+esc(name)+'</option>').join('')+'</select>';}else control='<input name="'+key+'" type="'+type+'" '+(required?'required':'')+' '+(type==='number'?'min="0" step="any"':'')+' value="'+esc(v)+'">';return '<label>'+esc(label)+control+'</label>';}
async function loadTable(){if(page==='producoes'){const [m,s]=await Promise.all([client.from('maquinas_vantor').select('*'),client.from('config_precificacao_vantor').select('*').eq('id',1).single()]);if(m.error||s.error)return err('Execute primeiro o SQL de atualização no Supabase: '+(m.error?.message||s.error?.message));machines=m.data;settings=s.data;}const {data,error}=await client.from(page).select('*').order('created_at',{ascending:false}).limit(5000);if(error)return err(error.message);records=data||[];if(page==='financeiro'){const dateKey=r=>{const d=r.data_efetivacao||r.vencimento||'';return /^\d{4}-\d{2}-\d{2}/.test(d)?d.slice(0,10):'';};records.sort((a,b)=>dateKey(b).localeCompare(dateKey(a))||String(b.created_at||'').localeCompare(String(a.created_at||''))||String(b.id||'').localeCompare(String(a.id||'')));}renderTable();}
function renderTable(){const cfg=configs[page];$('content').innerHTML='<section class="panel"><div class="sectionhead"><h2>'+cfg.title+'</h2><button class="primary" id="add">+ Novo registro</button></div><div class="notice">'+records.length+' registros. '+(page==='producoes'?'Os custos são gravados com os parâmetros do momento da impressão.':'')+'</div><div id="editor" class="hidden"></div><div class="tablewrap"><table><thead><tr>'+cfg.columns.map(c=>'<th>'+esc(c.replaceAll('_',' '))+'</th>').join('')+'<th>Ações</th></tr></thead><tbody>'+records.map(r=>'<tr>'+cfg.columns.map(c=>'<td>'+esc(page==='producoes'&&c==='maquina_vantor_id'?(machines.find(m=>m.id===r[c])?.nome||r[c]):['valor','valor_bruto','taxas_marketplace','custo_estimado','preco_base','custo_medio_unitario','custo_total_estimado'].includes(c)?brl(r[c]):c==='nota_fiscal_status'?(r[c]==='emitida'?'Com NF':r[c]==='nao_emitida'?'Sem NF':'A conferir'):r[c])+'</td>').join('')+'<td><button data-edit="'+esc(r.id)+'">Editar</button><button class="danger" data-del="'+esc(r.id)+'">Excluir</button></td></tr>').join('')+'</tbody></table></div></section>';$('add').onclick=()=>showForm();$('content').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>showForm(records.find(r=>r.id===b.dataset.edit)));$('content').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>removeRecord(b.dataset.del));}
function calculate(d){const m=machines.find(x=>x.id===d.maquina_vantor_id);if(!m)throw Error('Selecione uma impressora.');const h=Number(d.tempo_minutos||0)/60,fil=Number(d.peso_total_g||0)*Number(settings.custo_filamento_kg)/1000,energy=h*Number(m.potencia_w)/1000*Number(settings.tarifa_kwh),dep=h*Number(m.valor_aquisicao)/Number(m.vida_util_referencia_h)*Number(settings.reserva_depreciacao),base=fil+energy+dep+Number(d.outros_custos||0),error=base*Number(settings.margem_erro);return {custo_filamento:fil,custo_energia:energy,custo_depreciacao:dep,margem_erro_valor:error,custo_total_estimado:base+error,custo_kwh_snapshot:settings.tarifa_kwh,custo_kg_snapshot:settings.custo_filamento_kg,taxa_depreciacao_snapshot:settings.reserva_depreciacao,taxa_erro_snapshot:settings.margem_erro};}
function showForm(rec){editing=rec?.id||null;const editor=$('editor');editor.classList.remove('hidden');editor.innerHTML='<h3>'+(rec?'Editar registro':'Novo registro')+'</h3><form id="dataForm"><div class="formgrid">'+configs[page].fields.map(f=>fieldHTML(f,rec?.[f[0]])).join('')+'</div>'+(page==='producoes'?'<div id="estimate" class="notice"></div><p class="muted">Somente novas produções concluídas contam horas. Registros anteriores à implantação permanecem fora da soma.</p>':'')+'<div class="actions"><button class="primary" type="submit">Salvar</button><button type="button" id="cancelEdit">Cancelar</button></div></form>';$('cancelEdit').onclick=()=>editor.classList.add('hidden');$('dataForm').onsubmit=saveRecord;if(page==='producoes'){const preview=()=>{try{const f=$('dataForm'),d={};for(const x of configs.producoes.fields)d[x[0]]=f.elements[x[0]].value;const c=calculate(d);$('estimate').textContent='Estimativa: filamento '+brl(c.custo_filamento)+' • energia '+brl(c.custo_energia)+' • reserva '+brl(c.custo_depreciacao)+' • margem de erro '+brl(c.margem_erro_valor)+' • TOTAL '+brl(c.custo_total_estimado);}catch(ex){$('estimate').textContent=ex.message;}};$('dataForm').addEventListener('input',preview);preview();}editor.scrollIntoView({block:'start',behavior:'smooth'});}
async function saveRecord(e){e.preventDefault();const btn=e.target.querySelector('[type=submit]');btn.disabled=true;try{const d={};for(const f of configs[page].fields){let v=e.target.elements[f[0]].value;if(f[2]==='number')v=v===''?null:Number(v);else if(v==='')v=null;d[f[0]]=v;}if(page==='vendas'&&!editing&&d.nota_fiscal_status==='a_conferir')d.nota_fiscal_status=d.marketplace==='Shopee'?'emitida':d.marketplace==='Direta'?'nao_emitida':'a_conferir';if(page==='producoes'){Object.assign(d,calculate(d));if(!editing)d.contabilizar_horas=true;}const res=editing?await client.from(page).update(d).eq('id',editing):await client.from(page).insert(d);if(res.error)throw res.error;await loadTable();notify('Registro salvo com sucesso.');}catch(ex){notify('Não foi possível salvar: '+ex.message,true);}finally{btn.disabled=false;}}
async function removeRecord(id){if(!confirm('Excluir este registro? Esta ação não poderá ser desfeita pela interface.'))return;const {error}=await client.from(page).delete().eq('id',id);if(error)return notify(error.message,true);await loadTable();notify('Registro excluído.');}
async function printers(){const [m,p,a]=await Promise.all([client.from('maquinas_vantor').select('*').order('nome'),client.from('producoes').select('maquina_vantor_id,tempo_minutos,status,contabilizar_horas'),client.from('tentativas_encomenda_vantor').select('maquina_vantor_id,tempo_minutos')]);if(m.error||p.error||a.error)return err('Execute primeiro o SQL de atualização: '+(m.error?.message||p.error?.message||a.error?.message));machines=m.data;const hours=id=>p.data.filter(x=>x.maquina_vantor_id===id&&x.status==='concluida'&&x.contabilizar_horas).reduce((s,x)=>s+Number(x.tempo_minutos||0)/60,0)+(a.data||[]).filter(x=>x.maquina_vantor_id===id).reduce((s,x)=>s+Number(x.tempo_minutos||0)/60,0);$('content').innerHTML='<section class="panel"><h2>Impressoras</h2><div class="notice">As horas iniciais já incluem as impressões anteriores à implantação. Potências são estimativas ajustáveis.</div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(250px,1fr))">'+machines.map(m=>'<div class="metric"><h3>'+esc(m.nome)+'</h3><p>Compra: <strong>'+brl(m.valor_aquisicao)+'</strong></p><p>Horas iniciais: '+Number(m.horas_iniciais).toLocaleString('pt-BR')+' h</p><p>Novas horas (incluindo falhas): '+hours(m.id).toFixed(2)+' h</p><p><strong>Total: '+(Number(m.horas_iniciais)+hours(m.id)).toFixed(2)+' h</strong></p><button data-machine="'+esc(m.id)+'">Editar parâmetros</button></div>').join('')+'</div><div id="machineEditor"></div></section><div id="maintenanceArea"></div>';renderMaintenance();$('content').querySelectorAll('[data-machine]').forEach(b=>b.onclick=()=>editMachine(machines.find(x=>x.id===b.dataset.machine)));}

 if(c.error||h.error){$('maintenanceArea').innerHTML='<div class="notice error">Execute o SQL de manutenção: '+esc(c.error?.message||h.error?.message)+'</div>';return;}

async function tcgPage(){
 const names=['tcg_produtos_vantor','tcg_lotes_vantor','tcg_movimentacoes_vantor','tcg_estoque_resumo_vantor'];
 const res=await Promise.all(names.map(n=>client.from(n).select('*').limit(5000)));

 const fees=moves.filter(m=>m.tipo==='venda').reduce((a,m)=>a+moneyNumber(m.taxa_valor),0);
 const cost=moves.filter(m=>m.tipo==='venda').reduce((a,m)=>a+moneyNumber(m.custo_total),0);
 const giveaways=moves.filter(m=>['brinde','presente','cortesia'].includes(m.tipo)).reduce((a,m)=>a+moneyNumber(m.custo_total),0);
 // Projeções calculadas somente sobre o saldo disponível de cada lote.
 const availableStock=stock.filter(x=>Number(x.saldo)>0).map(x=>({
  ...x,qty:Number(x.saldo),unit:Number(x.custo_unitario),invested:Number(x.saldo)*Number(x.custo_unitario)
 }));
 const investedTotal=availableStock.reduce((a,x)=>a+x.invested,0);
 const stockQty=availableStock.reduce((a,x)=>a+x.qty,0);
 const scenarios=[10,20,30];
 const scenarioTotals=pct=>{const revenue=availableStock.reduce((a,x)=>a+x.invested*(1+pct/100),0);return {revenue,profit:revenue-investedTotal,jambleProfit:revenue*.9-investedTotal};};

 $('tcgPriceForm').onsubmit=e=>{e.preventDefault();const f=e.target,lote=lots.find(l=>l.lote_id===f.lote_id.value);if(!lote)return;const c=Number(lote.custo_total)/Math.max(1,Number(lote.quantidade_comprada)),markup=Number(f.markup.value),price=c*(1+markup/100);$('tcgPriceOutput').innerHTML='Custo por unidade: <strong>'+brl(c)+'</strong> · Preço sugerido Pix: <strong>'+brl(price)+'</strong> (lucro '+brl(price-c)+') · Jamble: <strong>'+brl(price)+'</strong> (lucro após 10%: '+brl(price*.9-c)+').';};
}
async function plansPage(){
 const [r,fin]=await Promise.all([client.from('financeiro_planos_vantor').select('*').order('criado_em',{ascending:false}),client.from('financeiro').select('id,grupo_parcelamento,status,valor,vencimento').limit(5000)]);if(r.error||fin.error)return err(r.error?.message||fin.error?.message);const plans=r.data||[], entries=fin.data||[];
 $('content').innerHTML='<section class="panel"><h2>Compras parceladas e despesas recorrentes</h2><p class="muted">As parcelas futuras ficam pendentes e não reduzem o caixa até serem pagas. Marque cada pagamento na aba Financeiro.</p><form id="planForm"><div class="formgrid">'+tcgFormField('Descrição','descricao')+'<label>Operação<select name="centro_custo"><option value="3d">Impressão 3D</option><option value="pokemon">Pokémon TCG</option><option value="geral">Geral</option><option value="pessoal">Pessoal / CPF</option></select></label>'+tcgFormField('Categoria','categoria')+'<label>Natureza<select name="natureza_financeira"><option value="operacional">Despesa operacional</option><option value="estoque">Compra de mercadorias</option><option value="pessoal_retirada">Retirada pessoal</option></select></label><label>Modalidade<select name="modalidade"><option value="parcelada">Compra parcelada</option><option value="recorrente">Mensal recorrente</option></select></label>'+tcgFormField('Valor total (parcelada) ou valor mensal (recorrente)','valor','number','min="0.01" step="0.01"')+tcgFormField('Número de parcelas (recorrente: meses a programar)','quantidade','number','value="6" min="1" max="120"')+tcgFormField('Primeiro vencimento','primeiro_vencimento','date','value="'+today()+'"')+'</div><label>Observações<input name="observacoes" type="text"></label><button class="primary">Programar cobranças</button></form></section><section class="panel"><h2>Planos cadastrados</h2><div class="tablewrap"><table><thead><tr><th>Descrição</th><th>Operação</th><th>Modalidade</th><th>Parcelas</th><th>Pagas</th><th>Ativo</th></tr></thead><tbody>'+plans.map(p=>{const es=entries.filter(e=>e.grupo_parcelamento===p.id);return '<tr><td>'+esc(p.descricao)+'</td><td>'+esc(p.centro_custo)+'</td><td>'+esc(p.modalidade)+'</td><td>'+es.length+'</td><td>'+es.filter(x=>x.status==='efetivado').length+'</td><td>'+esc(p.ativo?'Sim':'Não')+'</td></tr>';}).join('')+'</tbody></table></div></section>';
 $('planForm').onsubmit=async e=>{e.preventDefault();const f=e.target;const count=Number(f.quantidade.value),total=Number(f.valor.value),mode=f.modalidade.value;if(count<1||count>120||total<=0)return notify('Verifique valor e quantidade.',true);const plan={descricao:f.descricao.value,centro_custo:f.centro_custo.value,categoria:f.categoria.value,natureza_financeira:f.natureza_financeira.value,modalidade:mode,valor_total:mode==='parcelada'?total:null,valor_parcela:mode==='recorrente'?total:Math.round(total/count*100)/100,quantidade_parcelas:count,primeiro_vencimento:f.primeiro_vencimento.value,observacoes:f.observacoes.value||null};const {data,error}=await client.from('financeiro_planos_vantor').insert(plan).select('id').single();if(error)return notify('Plano não salvo: '+error.message,true);const rows=[];let accumulated=0;for(let i=0;i<count;i++){const [y,m,d]=plan.primeiro_vencimento.split('-').map(Number);const dt=new Date(Date.UTC(y,m-1+i,1));const yr=dt.getUTCFullYear(),mo=dt.getUTCMonth()+1;const last=new Date(Date.UTC(yr,mo,0)).getUTCDate();const date=yr+'-'+String(mo).padStart(2,'0')+'-'+String(Math.min(d,last)).padStart(2,'0');const value=mode==='recorrente'?total:i===count-1?Math.round((total-accumulated)*100)/100:Math.round(total/count*100)/100;accumulated+=value;rows.push({descricao:plan.descricao+' ('+(i+1)+'/'+count+')',categoria:plan.categoria,tipo:'saida',centro_custo:plan.centro_custo,natureza_financeira:plan.natureza_financeira,modalidade:mode,valor:value,vencimento:date,status:'pendente',grupo_parcelamento:data.id,parcela_numero:i+1,parcela_total:count,observacoes:plan.observacoes,chave_externa:'plano:'+data.id+':'+(i+1)});}const rr=await client.from('financeiro').insert(rows);await plansPage();notify(rr.error?'Plano salvo, mas parcelas não foram criadas: '+rr.error.message+'; não recadastre sem conferir.':'Plano e parcelas pendentes cadastrados.',!!rr.error);};
}
