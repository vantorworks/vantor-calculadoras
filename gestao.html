async function dashboard(){
 const names=['vendas_integradas_vantor','estoque_pronto_vantor','tentativas_encomenda_vantor','maquinas_vantor','producoes','financeiro','produtos'];
 const out=await Promise.all(names.map(n=>client.from(n).select('*').limit(5000)));
 const bad=out.find(x=>x.error);if(bad)return err('Erro ao carregar painel: '+bad.error.message);
 const [sales,stock,attempts,mach,prints,finance,products]=out.map(x=>x.data||[]);
 const sum=(arr,key)=>arr.reduce((a,x)=>a+Number(x[key]||0),0);
 const gross=sum(sales,'receita_bruta'),fees=sum(sales,'taxas_total'),payout=sum(sales,'repasse_liquido'),cost=sum(sales,'custo_producao'),taxes=sum(sales,'impostos'),profit=sum(sales,'lucro_estimado');
 const qty=sum(stock,'quantidade_disponivel'),stockValue=stock.reduce((a,x)=>a+Number(x.quantidade_disponivel||0)*Number(x.custo_unitario||0),0);
 const orders=sales.filter(x=>x.tipo_venda==='encomenda');
 const made=id=>attempts.filter(t=>t.venda_id===id).reduce((a,t)=>a+Number(t.quantidade_concluida||0),0);
 const pending=orders.filter(x=>made(x.id)<Number(x.quantidade||0));
 const paid=finance.filter(x=>x.status==='efetivado');const income=sum(paid.filter(x=>x.tipo==='entrada'),'valor'),expense=sum(paid.filter(x=>x.tipo==='saida'),'valor');
 const months=new Map();for(const sale of sales){const k=String(sale.created_at||'').slice(0,7);if(!/^\d{4}-\d{2}$/.test(k))continue;const x=months.get(k)||{month:k,gross:0,profit:0};x.gross+=Number(sale.receita_bruta||0);x.profit+=Number(sale.lucro_estimado||0);months.set(k,x);}
 const monthly=[...months.values()].sort((a,b)=>a.month.localeCompare(b.month)).slice(-6);const max=Math.max(1,...monthly.map(x=>x.gross));
 const metric=(label,value,detail='')=>'<div class="metric"><small>'+esc(label)+'</small><strong>'+esc(value)+'</strong>'+(detail?'<div class="muted" style="font-size:12px;margin-top:5px">'+esc(detail)+'</div>':'')+'</div>';
 const monthName=k=>{const [y,m]=k.split('-');return m+'/'+y;};
 const chart=monthly.length?'<div class="dash-chart">'+monthly.map(x=>'<div class="dash-month"><div class="dash-bararea"><div class="dash-bar" style="height:'+Math.max(2,x.gross/max*100).toFixed(2)+'%" title="'+esc(brl(x.gross))+'"></div></div><b>'+esc(monthName(x.month))+'</b><small>'+esc(brl(x.gross))+'</small><small>Lucro: '+esc(brl(x.profit))+'</small></div>').join('')+'</div>':'<p class="muted">Ainda não existem vendas integradas para exibir o gráfico.</p>';
 const machineHours=id=>prints.filter(x=>x.maquina_vantor_id===id&&x.status==='concluida'&&x.contabilizar_horas).reduce((a,x)=>a+Number(x.tempo_minutos||0)/60,0)+attempts.filter(x=>x.maquina_vantor_id===id).reduce((a,x)=>a+Number(x.tempo_minutos||0)/60,0);
 const maintData=await client.from('manutencao_config_vantor').select('*');
 if(maintData.error)return err('Manutenção: execute o SQL de manutenção preventiva. '+maintData.error.message);
 const maintenance=maintData.data||[];
 const maintenanceAlert=mach.map(m=>{const c=maintenance.find(x=>x.maquina_id===m.id);const current=Number(m.horas_iniciais||0)+machineHours(m.id);if(!c||c.ultima_manutencao_h===null)return '<div class="notice">'+esc(m.nome)+': histórico de lubrificação ainda não informado. Abra Impressoras para iniciar o controle.</div>';const left=Number(c.ultima_manutencao_h)+Number(c.intervalo_h)-current;return '<div class="notice '+(left<=0?'error':'')+'">'+esc(m.nome)+': '+(left<=0?'manutenção vencida há '+Math.abs(left).toFixed(1)+' h':left<=Number(c.aviso_antes_h)?'atenção: faltam '+left.toFixed(1)+' h para lubrificação':'próxima lubrificação em '+left.toFixed(1)+' h')+'</div>';}).join('');
 const machinesHTML=mach.map(x=>'<tr><td>'+esc(x.nome)+'</td><td>'+Number(x.horas_iniciais||0).toLocaleString('pt-BR')+' h</td><td>'+machineHours(x.id).toLocaleString('pt-BR',{maximumFractionDigits:2})+' h</td><td><strong>'+(Number(x.horas_iniciais||0)+machineHours(x.id)).toLocaleString('pt-BR',{maximumFractionDigits:2})+' h</strong></td></tr>').join('');

 $('content').innerHTML='<section class="panel"><div class="sectionhead"><h2>Painel geral · VANTOR</h2><button id="refreshDashboard">Atualizar dados</button></div><p class="muted">Indicadores das Vendas integradas. Não somamos Vendas antigas para evitar duplicidades.</p><div class="grid">'+

 '</div><div class="notice">O lucro inclui estimativas das encomendas ainda não concluídas. Os valores são calculados a partir dos registros de venda, não representam dinheiro recebido. Impostos registrados: '+brl(taxes)+'. Os dados de teste também aparecem nos totais.</div></section>'+

 '<section class="panel"><h2>Últimas vendas integradas</h2><div class="tablewrap"><table><thead><tr><th>Data</th><th>Produto</th><th>Canal</th><th>Tipo</th><th>Receita</th><th>Lucro</th></tr></thead><tbody>'+recent.map(x=>'<tr><td>'+esc(x.created_at?new Date(x.created_at).toLocaleDateString('pt-BR'):'—')+'</td><td>'+esc(productName(x.produto_id))+'</td><td>'+esc(x.canal)+'</td><td>'+esc(x.tipo_venda)+'</td><td>'+brl(x.receita_bruta)+'</td><td>'+brl(x.lucro_estimado)+(x.tipo_venda==='encomenda'&&made(x.id)<Number(x.quantidade||0)?' <small>(estimado)</small>':'')+'</td></tr>').join('')+'</tbody></table></div></section>';

function fieldHTML(f,v){const [key,label,type,required,opts]=f;v=v??(type==='date'&&key.startsWith('data_')?today():'');let control;if(type==='select'||type==='machine'){const options=type==='machine'?machines.map(m=>[m.id,m.nome]):opts.map(o=>[o,o]);control='<select name="'+key+'" '+(required?'required':'')+'>'+options.map(([id,name])=>'<option value="'+esc(id)+'" '+(id===v?'selected':'')+'>'+esc(name)+'</option>').join('')+'</select>';}else control='<input name="'+key+'" type="'+type+'" '+(required?'required':'')+' '+(type==='number'?'min="0" step="any"':'')+' value="'+esc(v)+'">';return '<label>'+esc(label)+control+'</label>';}
async function loadTable(){if(page==='producoes'){const [m,s]=await Promise.all([client.from('maquinas_vantor').select('*'),client.from('config_precificacao_vantor').select('*').eq('id',1).single()]);if(m.error||s.error)return err('Execute primeiro o SQL de atualização no Supabase: '+(m.error?.message||s.error?.message));machines=m.data;settings=s.data;}const {data,error}=await client.from(page).select('*').order('created_at',{ascending:false}).limit(500);if(error)return err(error.message);records=data||[];renderTable();}
function renderTable(){const cfg=configs[page];$('content').innerHTML='<section class="panel"><div class="sectionhead"><h2>'+cfg.title+'</h2><button class="primary" id="add">+ Novo registro</button></div><div class="notice">'+records.length+' registros. '+(page==='producoes'?'Os custos são gravados com os parâmetros do momento da impressão.':'')+'</div><div id="editor" class="hidden"></div><div class="tablewrap"><table><thead><tr>'+cfg.columns.map(c=>'<th>'+esc(c.replaceAll('_',' '))+'</th>').join('')+'<th>Ações</th></tr></thead><tbody>'+records.map(r=>'<tr>'+cfg.columns.map(c=>'<td>'+esc(page==='producoes'&&c==='maquina_vantor_id'?(machines.find(m=>m.id===r[c])?.nome||r[c]):['valor','valor_bruto','taxas_marketplace','custo_estimado','preco_base','custo_medio_unitario','custo_total_estimado'].includes(c)?brl(r[c]):r[c])+'</td>').join('')+'<td><button data-edit="'+esc(r.id)+'">Editar</button><button class="danger" data-del="'+esc(r.id)+'">Excluir</button></td></tr>').join('')+'</tbody></table></div></section>';$('add').onclick=()=>showForm();$('content').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>showForm(records.find(r=>r.id===b.dataset.edit)));$('content').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>removeRecord(b.dataset.del));}
function calculate(d){const m=machines.find(x=>x.id===d.maquina_vantor_id);if(!m)throw Error('Selecione uma impressora.');const h=Number(d.tempo_minutos||0)/60,fil=Number(d.peso_total_g||0)*Number(settings.custo_filamento_kg)/1000,energy=h*Number(m.potencia_w)/1000*Number(settings.tarifa_kwh),dep=h*Number(m.valor_aquisicao)/Number(m.vida_util_referencia_h)*Number(settings.reserva_depreciacao),base=fil+energy+dep+Number(d.outros_custos||0),error=base*Number(settings.margem_erro);return {custo_filamento:fil,custo_energia:energy,custo_depreciacao:dep,margem_erro_valor:error,custo_total_estimado:base+error,custo_kwh_snapshot:settings.tarifa_kwh,custo_kg_snapshot:settings.custo_filamento_kg,taxa_depreciacao_snapshot:settings.reserva_depreciacao,taxa_erro_snapshot:settings.margem_erro};}
function showForm(rec){editing=rec?.id||null;const editor=$('editor');editor.classList.remove('hidden');editor.innerHTML='<h3>'+(rec?'Editar registro':'Novo registro')+'</h3><form id="dataForm"><div class="formgrid">'+configs[page].fields.map(f=>fieldHTML(f,rec?.[f[0]])).join('')+'</div>'+(page==='producoes'?'<div id="estimate" class="notice"></div><p class="muted">Somente novas produções concluídas contam horas. Registros anteriores à implantação permanecem fora da soma.</p>':'')+'<div class="actions"><button class="primary" type="submit">Salvar</button><button type="button" id="cancelEdit">Cancelar</button></div></form>';$('cancelEdit').onclick=()=>editor.classList.add('hidden');$('dataForm').onsubmit=saveRecord;if(page==='producoes'){const preview=()=>{try{const f=$('dataForm'),d={};for(const x of configs.producoes.fields)d[x[0]]=f.elements[x[0]].value;const c=calculate(d);$('estimate').textContent='Estimativa: filamento '+brl(c.custo_filamento)+' • energia '+brl(c.custo_energia)+' • reserva '+brl(c.custo_depreciacao)+' • margem de erro '+brl(c.margem_erro_valor)+' • TOTAL '+brl(c.custo_total_estimado);}catch(ex){$('estimate').textContent=ex.message;}};$('dataForm').addEventListener('input',preview);preview();}editor.scrollIntoView({block:'start',behavior:'smooth'});}

 const sync=()=>{const d=current();const isStock=d.tipo==='estoque';$('saleColors').classList.toggle('hidden',isStock);f.elements.lote.disabled=!isStock;const available=stockRows.filter(x=>x.produto_id===d.produto);const old=d.lote;f.elements.lote.innerHTML=opt('','Selecione um lote')+available.map(x=>opt(x.id,n(x.quantidade_disponivel)+' disponíveis · '+brl(x.custo_unitario)+'/un.')).join('');if(available.some(x=>x.id===old))f.elements.lote.value=old;if(isStock&&f.elements.lote.value){f.elements.custo_unitario.value=stockRows.find(x=>x.id===f.elements.lote.value).custo_unitario;}else if(!isStock){f.elements.custo_unitario.value=catalog.find(x=>x.id===d.produto)?.custo_estimado||0;}preview();};
 const preview=()=>{const d=current(),c=calcSale(d);$('salePreview').innerHTML='<strong>Prévia</strong><div class="grid"><div class="metric"><span>Receita bruta</span><strong>'+brl(c.gross)+'</strong></div><div class="metric"><span>Taxas e descontos</span><strong>'+brl(c.fees)+'</strong></div><div class="metric"><span>Repasse líquido</span><strong>'+brl(c.payout)+'</strong></div><div class="metric"><span>Custo produção</span><strong>'+brl(c.production)+'</strong></div><div class="metric"><span>Impostos</span><strong>'+brl(c.taxes)+'</strong></div><div class="metric"><span>Lucro '+(d.tipo==='encomenda'?'estimado':'líquido')+'</span><strong>'+brl(c.profit)+'</strong></div></div>';};
 f.elements.produto.onchange=sync;f.elements.tipo.onchange=sync;f.elements.lote.onchange=()=>{const x=stockRows.find(x=>x.id===f.elements.lote.value);if(x)f.elements.custo_unitario.value=x.custo_unitario;preview();};f.elements.canal.onchange=()=>{const d=current();f.elements.comissao.value=d.canal==='Shopee'?(n(d.preco)<80?20:14):d.canal==='TikTok Shop'?(n(d.preco)<50?10:6):0;f.elements.resgate.value=d.canal==='Shopee'?0.49:0;preview();};f.elements.preco.onchange=()=>f.elements.canal.onchange();f.addEventListener('input',preview);sync();
 f.onsubmit=async e=>{e.preventDefault();const d=current();if(d.tipo==='estoque'&&!d.lote)return notify('Selecione um lote disponível.',true);if(d.tipo==='estoque'&&n(d.quantidade)>n(stockRows.find(x=>x.id===d.lote)?.quantidade_disponivel))return notify('Quantidade maior que o estoque do lote.',true);const c=calcSale(d);const allocations=[...$('saleColorRows').children].map(row=>({cor_id:row.querySelector('select').value,quantidade:Number(row.querySelector('input').value)})).filter(x=>x.cor_id);if(d.tipo==='encomenda'){if(!allocations.length||allocations.some(x=>!Number.isInteger(x.quantidade)||x.quantidade<=0)||allocations.reduce((a,x)=>a+x.quantidade,0)!==Number(d.quantidade)||new Set(allocations.map(x=>x.cor_id)).size!==allocations.length)return notify('Distribua a quantidade total entre cores distintas, sem repetir cores.',true);}const payload={p_produto_id:d.produto,p_lote_id:d.tipo==='estoque'?d.lote:null,p_tipo:d.tipo,p_canal:d.canal,p_quantidade:Number(d.quantidade),p_pedido:d.pedido||null,p_receita_bruta:c.gross,p_taxas_total:c.fees,p_repasse_liquido:c.payout,p_custo_producao:c.production,p_impostos:c.taxes,p_lucro_estimado:c.profit,p_detalhes:{...c.detail,params:d}};const btn=f.querySelector('button[type=submit]');btn.disabled=true;const {error}=await client.rpc(d.tipo==='encomenda'?'registrar_venda_com_cores_vantor':'registrar_venda_vantor',d.tipo==='encomenda'?{...payload,p_cores:allocations}:payload);btn.disabled=false;if(error)return notify('Venda não registrada: '+error.message,true);await salesPage();notify('Venda registrada. Estoque atualizado quando aplicável.');};
}


// Encomendas: tentativas de impressão com custo e horas separados por máquina.
async function ordersPage(){
 const [v,t,m,c,p,vc,tc,cr]=await Promise.all([
  client.from('vendas_integradas_vantor').select('*').eq('tipo_venda','encomenda').order('created_at',{ascending:false}).limit(500),
  client.from('tentativas_encomenda_vantor').select('*').order('created_at',{ascending:false}).limit(1000),
  client.from('maquinas_vantor').select('*').order('nome'),
  client.from('config_precificacao_vantor').select('*').eq('id',1).single(),
  client.from('produtos').select('id,nome'),
  client.from('venda_cores_vantor').select('*'),
  client.from('tentativa_cores_vantor').select('*'),
  client.from('cores_vantor').select('*')
 ]);
 const bad=[v,t,m,c,p,vc,tc,cr].find(x=>x.error);if(bad)return err('Não foi possível abrir encomendas: '+bad.error.message+' — confira se executou o SQL desta etapa.');
 const orders=v.data||[],tries=t.data||[],mach=m.data||[],prods=p.data||[],cfg=c.data,orderColors=vc.data||[],attemptColors=tc.data||[],colorNames=cr.data||[];const corNome=id=>colorNames.find(c=>c.id===id)?.nome||"Cor não encontrada";const colorReady=id=>attemptColors.filter(x=>x.venda_cor_id===id).reduce((sum,x)=>sum+n(tries.find(t=>t.id===x.tentativa_id)?.quantidade_concluida),0);
 const getName=id=>prods.find(x=>x.id===id)?.nome||id;
 const stats=id=>{const a=tries.filter(x=>x.venda_id===id);return {q:a.reduce((s,x)=>s+n(x.quantidade_concluida),0),cost:a.reduce((s,x)=>s+n(x.custo_total),0),fails:a.filter(x=>x.resultado==='falha').length,count:a.length};};
 const remaining=orders.filter(x=>stats(x.id).q<n(x.quantidade));
 $('content').innerHTML='<section class="panel"><h2>Encomendas e reimpressões</h2><div class="notice">Cada tentativa registra a impressora, tempo e custos. Falhas entram no custo do pedido, mas não aumentam a quantidade pronta. O lucro permanece estimado até produzir todas as unidades. Os custos são calculados usando os parâmetros cadastrados no momento do lançamento.</div>'+
 '<h3>Registrar impressão ou falha</h3><form id="attemptForm"><div class="formgrid"><label>Pedido pendente<select name="venda_id" required>'+opt('','Selecione')+remaining.map(x=>opt(x.id,getName(x.produto_id)+' · '+x.quantidade+' un. · '+(x.pedido_externo||x.id.slice(0,8)))).join('')+'</select></label><label>Cor / item a produzir<select name="venda_cor_id" required><option value="">Selecione o pedido</option></select></label><label>Impressora<select name="maquina_id" required>'+opt('','Selecione')+mach.map(x=>opt(x.id,x.nome)).join('')+'</select></label><label>Resultado<select name="resultado"><option value="concluida">Concluída</option><option value="falha">Falha / desperdício</option></select></label><label>Peças concluídas<input name="quantidade" type="number" min="0" step="1" value="1" required></label><label>Tempo da tentativa (minutos)<input name="minutos" type="number" min="0.01" step="0.01" required></label><label>Peso total utilizado (g)<input name="gramas" type="number" min="0" step="0.01" required></label><label>Outros custos desta tentativa (R$)<input name="outros" type="number" min="0" step="0.01" value="0" required></label></div><div id="attemptPreview" class="notice"></div><div class="actions"><button class="primary" type="submit">Registrar tentativa</button></div></form><p class="small muted">Se a impressão falhar, registre a tentativa com resultado Falha e zero peças concluídas. Cada tentativa é imutável para não duplicar custos e horas. Confira os valores antes de salvar.</p></section>'+
 '<section class="panel"><h2>Pedidos sob encomenda</h2><div class="tablewrap"><table><thead><tr><th>Produto</th><th>Canal</th><th>Produzidas</th><th>Tentativas</th><th>Falhas</th><th>Custo acumulado</th><th>Custo na venda</th><th>Lucro</th><th>Status</th></tr></thead><tbody>'+orders.map(x=>{const st=stats(x.id),ready=st.q>=n(x.quantidade);return '<tr><td>'+esc(getName(x.produto_id))+'</td><td>'+esc(x.canal)+'</td><td>'+st.q+'/'+x.quantidade+'</td><td>'+st.count+'</td><td>'+st.fails+'</td><td>'+brl(st.cost)+'</td><td>'+brl(x.custo_producao)+'</td><td>'+brl(x.lucro_estimado)+(ready?' (final)':' (estimado)')+'</td><td>'+esc(ready?'Pronto':'Aguardando produção')+'</td></tr>';}).join('')+'</tbody></table></div></section>'+
 '<section class="panel"><h2>Histórico de tentativas</h2><div class="tablewrap"><table><thead><tr><th>Data</th><th>Pedido</th><th>Impressora</th><th>Resultado</th><th>Peças</th><th>Tempo</th><th>Peso</th><th>Custo total</th></tr></thead><tbody>'+tries.map(x=>{const o=orders.find(y=>y.id===x.venda_id);return '<tr><td>'+esc(new Date(x.created_at).toLocaleString('pt-BR'))+'</td><td>'+esc(o?getName(o.produto_id):x.venda_id.slice(0,8))+'</td><td>'+esc(mach.find(y=>y.id===x.maquina_vantor_id)?.nome||x.maquina_vantor_id)+'</td><td>'+esc(x.resultado)+'</td><td>'+x.quantidade_concluida+'</td><td>'+n(x.tempo_minutos)+' min</td><td>'+n(x.peso_total_g)+' g</td><td>'+brl(x.custo_total)+'</td></tr>';}).join('')+'</tbody></table></div></section>';
 const f=$('attemptForm');
 const syncOrderColors=()=>{const id=f.elements.venda_id.value,rows=orderColors.filter(x=>x.venda_id===id),old=f.elements.venda_cor_id.value;f.elements.venda_cor_id.innerHTML=opt('','Selecione a cor')+rows.filter(x=>colorReady(x.id)<x.quantidade).map(x=>opt(x.id,corNome(x.cor_id)+' · '+(x.quantidade-colorReady(x.id))+' pendente(s)')).join('');if(rows.some(x=>x.id===old&&colorReady(x.id)<x.quantidade))f.elements.venda_cor_id.value=old;};
 f.elements.venda_id.onchange=syncOrderColors;syncOrderColors();
 const preview=()=>{const mid=f.elements.maquina_id.value,ma=mach.find(x=>x.id===mid),mins=n(f.elements.minutos.value),grams=n(f.elements.gramas.value),other=n(f.elements.outros.value),fil=grams*n(cfg.custo_filamento_kg)/1000,energy=ma?mins/60*n(ma.potencia_w)/1000*n(cfg.tarifa_kwh):0,dep=ma?mins/60*n(ma.valor_aquisicao)/Math.max(1,n(ma.vida_util_referencia_h))*n(cfg.reserva_depreciacao):0,base=fil+energy+dep+other,total=base*(1+n(cfg.margem_erro));$('attemptPreview').textContent='Custo estimado da tentativa: '+brl(total)+' (filamento '+brl(fil)+' + energia '+brl(energy)+' + depreciação '+brl(dep)+' + outros '+brl(other)+' + margem de erro '+brl(base*n(cfg.margem_erro))+').';};
 f.elements.resultado.onchange=()=>{if(f.elements.resultado.value==='falha'){f.elements.quantidade.value='0';f.elements.quantidade.disabled=true;}else{f.elements.quantidade.disabled=false;f.elements.quantidade.value='1';}preview();};
 f.addEventListener('input',preview);preview();
 f.onsubmit=async e=>{e.preventDefault();const order=orders.find(x=>x.id===f.elements.venda_id.value);if(!order)return notify('Selecione um pedido.',true);const q=f.elements.resultado.value==='falha'?0:Number(f.elements.quantidade.value),left=n(order.quantidade)-stats(order.id).q;if(q>left)return notify('Quantidade maior que o restante da encomenda.',true);const target=orderColors.find(x=>x.id===f.elements.venda_cor_id.value&&x.venda_id===order.id);if(!target)return notify('Selecione a cor do item a produzir.',true);if(q>target.quantidade-colorReady(target.id))return notify('Quantidade maior que o saldo pendente dessa cor.',true);if(!f.elements.maquina_id.value)return notify('Selecione uma impressora.',true);
 const btn=f.querySelector('button[type=submit]');btn.disabled=true;
 const key=crypto.randomUUID();const {data,error}=await client.rpc('registrar_tentativa_por_cor_vantor',{p_chave_requisicao:key,p_venda_id:order.id,p_venda_cor_id:target.id,p_maquina_id:f.elements.maquina_id.value,p_resultado:f.elements.resultado.value,p_quantidade_concluida:q,p_tempo_minutos:Number(f.elements.minutos.value),p_peso_total_g:Number(f.elements.gramas.value),p_outros_custos:Number(f.elements.outros.value)});
 if(error){btn.disabled=false;return notify('Tentativa não registrada: '+error.message,true);}await ordersPage();notify(data?.pedido_pronto?'Encomenda pronta! Custos e lucro atualizados.':'Tentativa registrada. Custo acumulado no pedido.');};
}
